name: Magonote

options:
  bundleIdPrefix: com.souta0104
  deploymentTarget:
    macOS: "14.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 8.0.0
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts.git
    from: 2.0.0
  MagonoteKit:
    path: ../../packages/MagonoteKit

targets:
  Magonote:
    type: application
    platform: macOS
    sources:
      - path: Magonote
      - path: GoogleService-Info.plist
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: KeyboardShortcuts
        product: KeyboardShortcuts
      - package: MagonoteKit
        product: MagonoteKit
    settings:
      base:
        SWIFT_VERSION: 6.0
        PRODUCT_BUNDLE_IDENTIFIER: com.souta0104.magonote.mac
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
    info:
      path: Magonote/Info.plist
      properties:
        CFBundleDisplayName: Magonote
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.539490518229-8joqu37j3ud31nln542apodvciedb08b
    entitlements:
      path: Magonote/Magonote.entitlements

  MagonoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MagonoteTests
    dependencies:
      - target: Magonote
    settings:
      base:
        SWIFT_VERSION: 6.0
